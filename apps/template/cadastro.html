<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ateliê Online</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="header-overlay"></div>
        <div class="header-content">
            <h1 class="header-title">Ateliê Online</h1>
            <nav class="nav">
                <a href="{{ url_for('main.rota_pricipal') }}" class="btn">Serviços</a>
                <a href="#" class="btn">Login</a>
                <a href="{{ url_for('main.rota_cadastro') }}" class="btn">Cadastro</a>
                <a href="#" class="btn">Desenvolvedores</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="cadastro-form">
            <h2>Cadastro de Serviço</h2>
            {% if erro %}
                <p class="error-message">{{ erro }}</p>
            {% endif %}
            <form action="{{ url_for('main.rota_cadastro') }}" method="post">
                <div class="form-group">
                    <label for="categoria">Categoria:</label>
                    <input type="text" id="categoria" name="categoria" required>
                </div>
                <div class="form-group">
                    <label for="tipo">Tipo:</label>
                    <input type="text" id="tipo" name="tipo" required>
                </div>
                <div class="form-group">
                    <label for="sexo">Sexo:</label>
                    <input type="text" id="sexo" name="sexo" required>
                </div>
                <div class="form-group">
                    <label for="servico">Serviço:</label>
                    <input type="text" id="servico" name="servico" required>
                </div>
                <div class="form-group">
                    <label for="detalhes">Detalhes:</label>
                    <textarea id="detalhes" name="detalhes"></textarea>
                </div>
                <button type="submit" class="btn">Cadastrar Serviço</button>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>Rua VejaBem n° 404 bairro:Python SP capital</p>
    </footer>

</body>
</html>
